<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>DeepSeek 遥控器</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#15171c;color:#e8eaed}
header{position:sticky;top:0;background:rgba(21,23,28,.94);backdrop-filter:blur(10px);padding:10px 14px;border-bottom:1px solid #262a33;display:flex;align-items:center;gap:8px}
header .t{font-size:15px;font-weight:600;flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:#8a8f98;flex:none}
.dot.ok{background:#38c172}.dot.bad{background:#e5534b}
main{padding:12px 14px 28px}
.card{background:#1c1f26;border:1px solid #2a2f3a;border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;color:#aab0ba;font-weight:600}
textarea{width:100%;min-height:88px;background:#121419;border:1px solid #2f3542;border-radius:8px;color:#e8eaed;padding:10px;font-size:15px;resize:vertical;font-family:inherit}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button{flex:1;min-width:92px;padding:12px 10px;border-radius:9px;border:0;font-size:14px;font-weight:600;background:#2c3340;color:#dfe3ea;cursor:pointer}
button.primary{background:#4d6bfe;color:#fff}
button:active{transform:translateY(1px);opacity:.9}
button:disabled{opacity:.45}
.toggle{display:flex;align-items:center;justify-content:space-between;font-size:14px}
.switch{width:52px;height:30px;border-radius:15px;background:#3a404c;position:relative;transition:.2s;flex:none}
.switch.on{background:#38c172}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{left:25px}
.kv{font-size:12px;color:#9aa2af;line-height:1.7;word-break:break-all}
.kv b{color:#cfd5de;font-weight:500}
.log{font-family:Consolas,monospace;font-size:11px;line-height:1.5;max-height:180px;overflow:auto;color:#aab0ba;white-space:pre-wrap;word-break:break-all}
.log .ok{color:#7ee2a8}.log .err{color:#ff9d97}.log .act{color:#8fb4ff}
.msg{font-size:12px;color:#8fb4ff;min-height:16px;margin-top:6px}

/* --- 回复着色 --- */
body,.kv,.log{font-variant-numeric:tabular-nums}
#reply{letter-spacing:0}
#reply .blk{margin:8px 0;padding:10px 10px 8px;border-radius:8px;font-family:Consolas,"Cascadia Mono",monospace;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;overflow:auto;position:relative;letter-spacing:0}
#reply .blk-ps{background:#0d2418;border:1px solid #1f5c3c;color:#8ff0b6}
#reply .blk-code{background:#131a26;border:1px solid #2b3a55;color:#a9c7ff}
#reply .blk .lang{position:absolute;top:3px;right:8px;font-size:9px;color:#6d7480;letter-spacing:.5px}
#reply .ic{background:rgba(255,255,255,.09);border-radius:4px;padding:1px 4px;font-family:Consolas,monospace;font-size:12px;color:#ffd479}
#reply .num{color:#7ee2a8;font-variant-numeric:tabular-nums}
.log{font-variant-numeric:tabular-nums}

#replyList{max-height:60vh;overflow:auto;scroll-behavior:auto}
#replyList .item{border-top:1px solid #262a33;padding:8px 0}
#replyList .item:first-child{border-top:0}
#replyList .item:last-child{border-bottom:2px solid #4d6bfe}
#replyList .meta{font-size:10.5px;color:#6d7480;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
#replyList .idx{color:#4d6bfe;font-weight:600}
#replyList .body{font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:#dfe3ea;max-height:220px;overflow:auto}
#replyList .item.old .body{max-height:none}
#replyList .toggle{font-size:10.5px;color:#8fb4ff;cursor:pointer;user-select:none;margin-top:4px}

/* ===== 回复列表 v2 ===== */
#replyList .item{padding:10px 0;border-top:1px solid #262a33}
#replyList .item:first-child{border-top:0}
#replyList .meta{font-size:10.5px;color:#6d7480;margin-bottom:5px}
#replyList .final .fbody{font-size:14px;font-weight:700;line-height:1.68;color:#eef1f5;white-space:pre-wrap;word-break:break-word}
#replyList .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#replyList .proc .ptext{font-size:12px;font-weight:300;color:#98a0ad;line-height:1.6;white-space:pre-wrap;word-break:break-word}
#replyList .proc .pdetail{display:none;margin-top:8px}
#replyList .proc.open .pdetail{display:block}
#replyList .final.open .fbody{display:block;-webkit-line-clamp:unset;overflow:visible;max-height:none}
#replyList .ptoggle{font-size:10.5px;color:#8fb4ff;cursor:pointer;user-select:none;margin-top:6px;display:inline-block}
#replyList .exmeta{font-size:11px;margin:8px 0 5px;color:#9aa2af}
#replyList .exmeta.ok{color:#7ee2a8}
#replyList .exmeta.err{color:#ff9d97}
#replyList .exout{background:#12161d;border:1px solid #232a36;border-radius:6px;padding:8px;font-family:Consolas,monospace;font-size:11px;line-height:1.5;color:#aab0ba;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;margin:0}
</style></head><body>
<header><span class="dot" id="dot"></span><span class="t">DeepSeek 遥控器</span><span id="conn" style="font-size:11px;color:#8a8f98"></span></header>
<main>
<div class="card">
  <h3>发给 DeepSeek</h3>
  <textarea id="msg" placeholder="输入要发送给 DeepSeek 的内容…"></textarea>
  <div class="row">
    <button class="primary" id="send">发送</button>
    <button id="rules">发送规则</button>
  </div>
  <div class="msg" id="sendmsg"></div>
</div>


<div class="card">
  <h3>DeepSeek 最新回复</h3>
  <div id="replyList"></div>
  <div style="font-size:11px;color:#6d7480;margin-top:6px" id="replymeta"></div>
</div>

<div class="card">
  <div class="toggle"><span>自动执行</span><div class="switch" id="sw"><i></i></div></div>
  <div class="row">
    <button id="check">立即检查</button>
    <button id="reset">重置计数</button>
  </div>
</div>

<div class="card">
  <h3>直接执行 PowerShell</h3>
  <textarea id="cmd" placeholder="例如：Get-Date" style="min-height:64px;font-family:Consolas,monospace"></textarea>
  <div class="row"><button id="run">执行</button></div>
  <div class="log" id="out" style="margin-top:8px"></div>
</div>

<div class="card">
  <h3>状态</h3>
  <div class="kv" id="status">加载中…</div>
</div>

<div class="card">
  <h3>最近日志</h3>
  <div class="log" id="log"></div>
</div>
</main>
<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const H = { 'Content-Type': 'application/json', 'X-Remote-Token': TOKEN };
const $ = (id) => document.getElementById(id);
let enabled = true;

async function api(path, body) {
  const opt = body === undefined ? { headers: H } : { method: 'POST', headers: H, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function setMsg(el, text, ok) {
  el.textContent = text || '';
  el.style.color = ok === false ? '#ff9d97' : '#8fb4ff';
}
const FENCE = String.fromCharCode(96, 96, 96);
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}

const ZW_RE = /[\u200b-\u200f\u202a-\u202e\u2060\ufeff]/g;
function stripZw(v) { return String(v == null ? '' : v).replace(ZW_RE, ''); }

function fmtReplyHtml(raw) {
  const text = stripZw(raw).replace(/\r\n?/g, '\n');
  const parts = text.split('\u0060\u0060\u0060');
  let html = '';
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      let body = parts[i];
      const nl = body.indexOf('\n');
      let lang = '';
      if (nl >= 0) { lang = body.slice(0, nl).trim().toLowerCase(); body = body.slice(nl + 1); }
      const isPs = /^(powershell|pwsh|ps1|ps)$/.test(lang);
      html += '<pre class="blk ' + (isPs ? 'blk-ps' : 'blk-code') + '"><span class="lang">'
        + escapeHtml(lang || 'code') + '</span>' + escapeHtml(body.replace(/\n+$/, '')) + '</pre>';
    } else {
      let seg = escapeHtml(parts[i]);
      seg = seg.replace(/\u0060([^\u0060\n]+)\u0060/g, '<code class="ic">$1</code>');
      html += seg;
    }
  }
  return html;
}

async function refresh() {
  try {
    const st = await api('/api/status');
    $('dot').className = 'dot ' + (st.bridgeOk ? 'ok' : 'bad');
    $('conn').textContent = st.extensionOnline ? '扩展在线' : '扩展离线';
    enabled = !!st.enabled;
    $('sw').classList.toggle('on', enabled);
    $('status').innerHTML =
      '<div><b>桥：</b>' + (st.bridgeOk ? '正常' : '异常') + '</div>' +
      '<div><b>扩展：</b>' + (st.extensionOnline ? '在线（' + Math.round(st.extensionAgeSec) + 's 前）' : '离线') + '</div>' +
      '<div><b>自动执行：</b>' + (enabled ? '开' : '关') + '</div>' +
      '<div><b>已执行：</b>' + (st.runs == null ? '?' : st.runs) + ' / ' + (st.maxRuns == null ? '?' : st.maxRuns) + '</div>' +
      '<div><b>工作目录：</b>' + escapeHtml(st.cwd || '') + '</div>';

    function splitCodeLocal(text) {
      const raw = stripZw(text).replace(/\r\n?/g, '\n');
      const parts = raw.split(FENCE);
      const texts = [];
      const codes = [];
      for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 1) {
          let body = parts[i];
          const nl = body.indexOf('\n');
          let lang = '';
          if (nl >= 0) { lang = body.slice(0, nl).trim(); body = body.slice(nl + 1); }
          codes.push({ lang: lang, code: body.replace(/\n+$/, '') });
        } else if (parts[i].trim()) {
          texts.push(parts[i]);
        }
      }
      return { texts: texts, codes: codes };
    }
    function normCmd(v) {
      return String(v || '').replace(/\r\n?/g, '\n').replace(/\s+/g, ' ').trim();
    }
    function findExecFor(codes, replyAt, nextAt, execs) {
      if (!codes.length || !execs.length) return null;
      const target = normCmd(codes[codes.length - 1].code);
      for (let i = 0; i < execs.length; i++) {
        if (normCmd(execs[i].command) === target) return execs[i];
      }
      for (let i = 0; i < execs.length; i++) {
        const e = execs[i];
        if (e.at >= replyAt && e.at < nextAt) return e;
      }
      return null;
    }
    function renderReplyList(reps, execs) {
      if (!reps.length) {
        $('replyList').innerHTML = '<div style="color:#6d7480;font-size:12px">（暂无）</div>';
        $('replymeta').textContent = '';
        return;
      }
      let lastFinal = -1;
      for (let i = reps.length - 1; i >= 0; i--) {
        if (!splitCodeLocal(reps[i].text || '').codes.length) { lastFinal = i; break; }
      }
      let html = '';
      for (let i = 0; i < reps.length; i++) {
        const it = reps[i];
        const t = new Date(it.at).toLocaleTimeString();
        const sp = splitCodeLocal(it.text || '');
        const isProcess = sp.codes.length > 0;
        const nextAt = (i + 1 < reps.length) ? reps[i + 1].at : Infinity;
        if (isProcess) {
          const exec = findExecFor(sp.codes, it.at, nextAt, execs);
          const textOnly = sp.texts.join('\n').trim() || '（仅代码，无文字说明）';
          let detail = '';
          sp.codes.forEach(function (c) {
            const isPs = /^(powershell|pwsh|ps1|ps)$/i.test((c.lang || '').trim());
            detail += '<pre class="blk ' + (isPs ? 'blk-ps' : 'blk-code') + '"><span class="lang">'
              + escapeHtml((c.lang || 'code')) + '</span>' + escapeHtml(c.code) + '</pre>';
          });
          if (exec) {
            const ok = exec.exitCode === 0 && !exec.timedOut;
            const dur = ((exec.durationMs || 0) / 1000).toFixed(1);
            detail += '<div class="exmeta ' + (ok ? 'ok' : 'err') + '">'
              + (ok ? '✔ 成功' : '✘ 失败') + ' · 退出码 ' + (exec.exitCode == null ? '?' : exec.exitCode)
              + ' · ' + dur + 's' + (exec.timedOut ? ' · 已超时' : '') + '</div>';
            const outTxt = (exec.stdout || '') + (exec.stderr ? ('\nstderr:\n' + exec.stderr) : '');
            if (outTxt.trim()) detail += '<pre class="exout">' + escapeHtml(outTxt) + '</pre>';
          } else {
            detail += '<div class="exmeta">（暂无执行记录）</div>';
          }
          html += '<div class="item proc">'
            + '<div class="meta">过程 · ' + t + '</div>'
            + '<div class="ptext">' + escapeHtml(textOnly) + '</div>'
            + '<div class="pdetail">' + detail + '</div>'
            + '<div class="ptoggle">展开代码与结果 ▾</div>'
            + '</div>';
        } else {
          const isLatest = (i === lastFinal);
          html += '<div class="item final">'
            + '<div class="meta">最终回答 · ' + t + '</div>'
            + '<div class="fbody' + (isLatest ? '' : ' clamp2') + '">' + fmtReplyHtml(it.text || '（空）') + '</div>'
            + (isLatest ? '' : '<div class="ptoggle">展开全文 ▾</div>')
            + '</div>';
        }
      }
      const box = $('replyList');
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
      const prevH = box.scrollHeight;
      box.innerHTML = html;
      if (atBottom || box.dataset.init !== '1') { box.scrollTop = box.scrollHeight; box.dataset.init = '1'; }
      else { box.scrollTop = box.scrollHeight - prevH + box.scrollTop; }
      $('replymeta').textContent = '共 ' + reps.length + ' 条（最新在下）';
    }
    const reps = st.replies || [];
    const execs = st.execs || [];
    renderReplyList(reps, execs);
    const logs = (st.log || []).slice(-20).reverse();
    $('log').innerHTML = logs.map(function (it) {
      const t = new Date(it.t).toLocaleTimeString();
      const cls = it.kind === 'ok' ? 'ok' : it.kind === 'err' ? 'err' : it.kind === 'act' ? 'act' : '';
      return '<span style="color:#6e7683">' + t + '</span> <span class="' + cls + '">' + escapeHtml(it.text) + '</span>';
    }).join('<br>');
  } catch (e) {
    $('dot').className = 'dot bad';
    $('conn').textContent = '无法连接';
    $('status').textContent = '无法连接桥：' + e.message;
  }
}
$('send').onclick = async function () {
  const text = $('msg').value.trim();
  if (!text) return;
  $('send').disabled = true;
  try { await api('/api/send', { text: text }); $('msg').value = ''; setMsg($('sendmsg'), '已排队，等待扩展发送…'); }
  catch (e) { setMsg($('sendmsg'), '失败：' + e.message, false); }
  finally { $('send').disabled = false; }
};
$('rules').onclick = async function () {
  try { await api('/api/rules', {}); setMsg($('sendmsg'), '已排队发送规则…'); }
  catch (e) { setMsg($('sendmsg'), '失败：' + e.message, false); }
};
$('sw').onclick = async function () {
  enabled = !enabled;
  $('sw').classList.toggle('on', enabled);
  try { await api('/api/enabled', { enabled: enabled }); }
  catch (e) { setMsg($('sendmsg'), '开关失败：' + e.message, false); refresh(); }
};
$('check').onclick = async function () {
  try { await api('/api/check', {}); setMsg($('sendmsg'), '已请求扩展立即检查'); }
  catch (e) { setMsg($('sendmsg'), '失败：' + e.message, false); }
};
$('reset').onclick = async function () {
  try { await api('/api/reset', {}); setMsg($('sendmsg'), '已重置计数'); }
  catch (e) { setMsg($('sendmsg'), '失败：' + e.message, false); }
};
$('run').onclick = async function () {
  const command = $('cmd').value.trim();
  if (!command) return;
  $('run').disabled = true;
  $('out').textContent = '执行中…';
  try {
    const r = await api('/api/exec', { command: command });
    const parts = [];
    parts.push('exit=' + (r.exitCode == null ? '?' : r.exitCode) + '  ' + ((r.durationMs || 0) / 1000).toFixed(2) + 's' + (r.timedOut ? ' (超时)' : ''));
    if (r.stdout) parts.push(r.stdout.replace(/\s+$/, ''));
    if (r.stderr) parts.push('stderr:\n' + r.stderr.replace(/\s+$/, ''));
    if (r.error) parts.push('error: ' + r.error);
    $('out').textContent = parts.join('\n');
  } catch (e) { $('out').textContent = '失败：' + e.message; }
  finally { $('run').disabled = false; refresh(); }
};
document.addEventListener('click', function (ev) {
  const t = ev.target;
  if (!t || !t.classList || !t.classList.contains('ptoggle')) return;
  const item = t.closest('.item');
  if (!item) return;
  const on = item.classList.toggle('open');
  const label = t;
  if (item.classList.contains('proc')) label.textContent = on ? '收起代码与结果 ▴' : '展开代码与结果 ▾';
  else label.textContent = on ? '收起 ▴' : '展开全文 ▾';
});

refresh();
setInterval(refresh, 2500);
</script>
</body></html>
